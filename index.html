<!DOCTYPE html>
<html>
<head>
  <title>Para Você</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background-color: #000;
      padding: 20px;
    }

    .sidebar h2 {
      color: #1DB954;
      margin-bottom: 30px;
    }

    .sidebar a {
      display: block;
      color: #b3b3b3;
      text-decoration: none;
      margin: 12px 0;
      font-size: 0.95em;
    }

    .sidebar a:hover {
      color: white;
    }

    /* MAIN */
    .main {
      flex: 1;
      overflow-y: auto;
    }

    .banner {
      background: linear-gradient(180deg, #1DB954, #121212);
      padding: 40px;
    }

    .banner h1 {
      font-size: 3em;
      margin: 10px 0;
    }

    .banner p {
      color: #d9d9d9;
    }

    /* PLAYLIST */
    .playlist {
      padding: 20px 40px;
    }

    .music {
      display: grid;
      grid-template-columns: 50px 1fr 100px;
      align-items: center;
      padding: 10px;
      border-radius: 6px;
    }

    .music:hover {
      background-color: #181818;
    }

    .music img {
      width: 50px;
      height: 50px;
      border-radius: 4px;
    }

    .music-info {
      margin-left: 15px;
    }

    .music-title {
      font-size: 0.95em;
    }

    .music-artist {
      font-size: 0.8em;
      color: #b3b3b3;
    }

    .play-btn {
      background-color: #1DB954;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }

    .play-btn:hover {
      transform: scale(1.05);
    }

    /* PLAYER */
    .player {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #181818;
      padding: 10px;
      border-top: 1px solid #282828;
      display: flex;
      justify-content: center;
    }

    audio {
      width: 350px;
    }

    /* RESPONSIVO */
    @media(max-width: 768px){
      .sidebar {
        display: none;
      }

      .playlist {
        padding: 20px;
      }
    }

  </style>
</head>

<body>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>Spotify</h2>
    <a href="#">Início</a>
    <a href="#">Buscar</a>
    <a href="#">Sua Playlist</a>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="banner">
      <p>Playlist</p>
      <h1>Nossa História</h1>
      <p>Uma seleção especial</p>
    </div>

    <div class="playlist">

      <div class="music">
        <img src="capa1.jpg">
        <div class="music-info">
          <div class="music-title">Nome da Música</div>
          <div class="music-artist">Artista</div>
        </div>
        <button class="play-btn" onclick="tocar('musica1.mp3')">Play</button>
      </div>

      <div class="music">
        <img src="capa2.jpg">
        <div class="music-info">
          <div class="music-title">Outra Música</div>
          <div class="music-artist">Artista</div>
        </div>
        <button class="play-btn" onclick="tocar('musica2.mp3')">Play</button>
      </div>

      <div class="music">
        <img src="capa3.jpg">
        <div class="music-info">
          <div class="music-title">Nossa Música</div>
          <div class="music-artist">Especial</div>
        </div>
        <button class="play-btn" onclick="tocar('musica3.mp3')">Play</button>
      </div>

    </div>

  </div>

</div>

<!-- PLAYER -->
<div class="player">
  <audio id="player" controls></audio>
</div>

<script>
function tocar(src){
  const player = document.getElementById("player");
  player.src = src;
  player.play();
}
</script>

</body>
</html>
