<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lembrei De Você Nos Primeiros Poemas</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #121212;
  color: white;
}

header {
  padding: 30px 20px 5px;
  font-size: 28px;
  font-weight: 700;
}

.sub {
  padding: 0 20px;
  color: #b3b3b3;
  font-size: 14px;
}

.contador {
  padding: 10px 20px 20px;
  font-size: 14px;
  color: #1db954;
}

.container {
  padding: 20px;
}

.card {
  display: flex;
  align-items: center;
  gap: 15px;
  background: #181818;
  padding: 14px;
  margin: 10px 0;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.25s;
}

.card:hover {
  background: #242424;
}

.card img {
  width: 56px;
  height: 56px;
  border-radius: 6px;
  object-fit: cover;
}

.info h3 {
  margin: 0;
  font-size: 15px;
}

.info p {
  margin: 2px 0;
  color: #a7a7a7;
  font-size: 13px;
}

/* PLAYER */
.player-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none;
  align-items: center;
  justify-content: center;
}

.player-bg {
  position: absolute;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  filter: blur(40px);
  opacity: 0.35;
}

.player-content {
  position: relative;
  z-index: 2;
  text-align: center;
}

.player-content img {
  width: 240px;
  border-radius: 12px;
  margin-bottom: 20px;
}

.player-content iframe {
  margin-top: 20px;
  width: 320px;
  height: 80px;
  border-radius: 10px;
  border: none;
}

.close-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  background: white;
  border: none;
  padding: 8px 11px;
  border-radius: 50%;
  cursor: pointer;
}
</style>

</head>
<body>

<header>Nossa Playlist</header>
<div class="sub">Feita especialmente para você</div>
<div class="contador" id="contador"></div>

<div class="container">

  <div class="card" onclick="abrirMusica('1ngbz6irbfEmpsYcZhzX6L','baby.jpg','Eternamente','Gal Costa')">
    <img src="baby.jpg">
    <div class="info">
      <h3>Eternamente</h3>
      <p>Gal Costa</p>
    </div>
  </div>

  <div class="card" onclick="abrirMusica('1wr0uRurcTSeBXIfyrTVKC','mulher.jpg','Mulher Homem Bicho','Ana Frango Elétrico')">
    <img src="mulher.jpg">
    <div class="info">
      <h3>Mulher Homem Bicho</h3>
      <p>Ana Frango Elétrico</p>
    </div>
  </div>

  <div class="card" onclick="abrirMusica('6fPan2saHdFaIHuTSatORv','lunch.jpg','L\'AMOUR DE MA VIE','Billie Eilish')">
    <img src="lunch.jpg">
    <div class="info">
      <h3>L'AMOUR DE MA VIE</h3>
      <p>Billie Eilish</p>
    </div>
  </div>

</div>

<div class="player-screen" id="playerScreen">
  <div class="player-bg" id="bg"></div>

  <button class="close-btn" onclick="fechar()">✕</button>

  <div class="player-content">
    <img id="capa">
    <h2 id="titulo"></h2>
    <p id="artista"></p>
    <iframe id="playerFrame"></iframe>
  </div>
</div>

<script>
// PLAYER
function abrirMusica(id, img, titulo, artista) {
  document.getElementById("playerFrame").src = "https://open.spotify.com/embed/track/" + id;
  document.getElementById("capa").src = img;
  document.getElementById("titulo").innerText = titulo;
  document.getElementById("artista").innerText = artista;
  document.getElementById("bg").style.backgroundImage = "url('" + img + "')";
  document.getElementById("playerScreen").style.display = "flex";
}

function fechar() {
  document.getElementById("playerScreen").style.display = "none";
  document.getElementById("playerFrame").src = "";
}

// CONTADOR
const inicio = new Date("2026-02-07T00:00:00");

function atualizarContador() {
  const agora = new Date();
  const diff = agora - inicio;

  const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
  const horas = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutos = Math.floor((diff / (1000 * 60)) % 60);
  const segundos = Math.floor((diff / 1000) % 60);

  document.getElementById("contador").innerText =
    "Juntos há: " +
    dias + " dias, " +
    horas.toString().padStart(2, '0') + "h " +
    minutos.toString().padStart(2, '0') + "m " +
    segundos.toString().padStart(2, '0') + "s";
}

setInterval(atualizarContador, 1000);
atualizarContador();
</script>

</body>
</html>
