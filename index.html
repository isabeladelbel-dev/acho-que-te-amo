<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Nossa Playlist</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: white;
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 200px;
  background: #000;
  padding: 20px;
}

.sidebar h2 {
  font-size: 18px;
  margin-bottom: 20px;
}

.sidebar p {
  color: #b3b3b3;
  font-size: 14px;
}

/* MAIN */
.main {
  flex: 1;
  background: linear-gradient(to bottom, #1db954, #121212);
  padding: 20px;
}

/* HEADER PLAYLIST */
.playlist-header {
  display: flex;
  align-items: center;
  gap: 20px;
}

.playlist-header img {
  width: 180px;
  height: 180px;
  object-fit: cover;
}

.playlist-header h1 {
  font-size: 40px;
}

/* CONTADOR */
.contador {
  margin-top: 10px;
  color: #ddd;
  font-size: 14px;
}

/* LISTA */
.list {
  margin-top: 30px;
}

.item {
  display: grid;
  grid-template-columns: 30px 1fr 1fr;
  padding: 10px;
  border-radius: 5px;
  cursor: pointer;
}

.item:hover {
  background: rgba(255,255,255,0.1);
}

/* PLAYER */
.player {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #181818;
  padding: 10px;
  display: none;
  justify-content: center;
}
</style>

</head>
<body>

<div class="sidebar">
  <h2>Sua Biblioteca</h2>
  <p>Playlist especial</p>
</div>

<div class="main">

  <div class="playlist-header">
    <img src="baby.jpg">
    <div>
      <p>Playlist</p>
      <h1>Nossa Playlist</h1>
      <div class="contador" id="contador"></div>
    </div>
  </div>

  <div class="list">

    <div class="item" onclick="tocar('1ngbz6irbfEmpsYcZhzX6L')">
      <div>1</div>
      <div>Eternamente</div>
      <div>Gal Costa</div>
    </div>

    <div class="item" onclick="tocar('1wr0uRurcTSeBXIfyrTVKC')">
      <div>2</div>
      <div>Mulher Homem Bicho</div>
      <div>Ana Frango Elétrico</div>
    </div>

    <div class="item" onclick="tocar('6fPan2saHdFaIHuTSatORv')">
      <div>3</div>
      <div>L'AMOUR DE MA VIE</div>
      <div>Billie Eilish</div>
    </div>

  </div>

</div>

<div class="player" id="player">
  <iframe id="frame" width="300" height="80"></iframe>
</div>

<script>
// PLAYER
function tocar(id) {
  document.getElementById("frame").src =
    "https://open.spotify.com/embed/track/" + id;
  document.getElementById("player").style.display = "flex";
}

// CONTADOR
const inicio = new Date("2026-02-07");

function atualizar() {
  const agora = new Date();
  const diff = agora - inicio;

  const dias = Math.floor(diff / (1000*60*60*24));
  const horas = Math.floor((diff/(1000*60*60)) % 24);
  const minutos = Math.floor((diff/(1000*60)) % 60);

  document.getElementById("contador").innerText =
    dias + " dias, " + horas + "h " + minutos + "m juntos";
}

setInterval(atualizar, 1000);
atualizar();
</script>

</body>
</html>
