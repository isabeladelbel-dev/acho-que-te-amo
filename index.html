<!DOCTYPE html>
<html>
<head>
  <title>Para Você</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #eaeaea;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 220px;
      background-color: #000;
      padding: 25px 20px;
    }

    .sidebar h2 {
      font-size: 1.2em;
      font-weight: normal;
      margin-bottom: 30px;
      color: #eaeaea;
    }

    .sidebar p {
      margin: 12px 0;
      color: #b3b3b3;
      cursor: pointer;
      font-size: 0.95em;
    }

    .sidebar p:hover {
      color: white;
    }

    /* MAIN */
    .main {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .header {
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2em;
      font-weight: normal;
      margin-bottom: 5px;
    }

    .header p {
      color: #b3b3b3;
      font-size: 0.95em;
    }

    /* PLAYLIST */
    .music {
      display: flex;
      align-items: center;
      padding: 12px;
      border-radius: 6px;
      transition: 0.2s;
    }

    .music:hover {
      background-color: #1e1e1e;
    }

    .music img {
      width: 50px;
      height: 50px;
      border-radius: 4px;
      margin-right: 15px;
    }

    .music-info {
      flex: 1;
    }

    .music-title {
      font-size: 0.95em;
    }

    .music-artist {
      font-size: 0.8em;
      color: #9a9a9a;
    }

    .play-btn {
      background: none;
      border: 1px solid #555;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      color: #eaeaea;
      font-size: 0.85em;
      transition: 0.2s;
    }

    .play-btn:hover {
      border-color: white;
    }

    /* PLAYER */
    .player {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #181818;
      padding: 10px;
      display: flex;
      justify-content: center;
      border-top: 1px solid #2a2a2a;
    }

    audio {
      width: 280px;
    }

    /* RESPONSIVO */
    @media(max-width: 768px){
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        display: flex;
        justify-content: space-around;
      }
    }

  </style>
</head>

<body>

<div class="container">

  <div class="sidebar">
    <h2>Playlist</h2>
    <p>Início</p>
    <p>Nossa História</p>
    <p>Momentos</p>
    <p>Para Você</p>
  </div>

  <div class="main">

    <div class="header">
      <h1>Nossa História</h1>
      <p>Algumas músicas que me lembram você</p>
    </div>

    <div class="music">
      <img src="capa1.jpg">
      <div class="music-info">
        <div class="music-title">Nome da Música</div>
        <div class="music-artist">Artista</div>
      </div>
      <button class="play-btn" onclick="tocar('musica1.mp3')">Play</button>
    </div>

    <div class="music">
      <img src="capa2.jpg">
      <div class="music-info">
        <div class="music-title">Outra Música</div>
        <div class="music-artist">Artista</div>
      </div>
      <button class="play-btn" onclick="tocar('musica2.mp3')">Play</button>
    </div>

    <div class="music">
      <img src="capa3.jpg">
      <div class="music-info">
        <div class="music-title">Nossa Música</div>
        <div class="music-artist">Especial</div>
      </div>
      <button class="play-btn" onclick="tocar('musica3.mp3')">Play</button>
    </div>

  </div>

</div>

<div class="player">
  <audio id="player" controls></audio>
</div>

<script>
function tocar(src){
  const player = document.getElementById("player");
  player.src = src;
  player.play();
}
</script>

</body>
</html>
