<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Nossa Playlist</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #121212;
  color: white;
  overflow-x: hidden;
}

/* TEXTOS DE FUNDO */
.bg-text {
  position: fixed;
  font-size: 14px;
  color: rgba(255,255,255,0.06);
  pointer-events: none;
  user-select: none;
  width: 100%;
}

.t1 { top: 15%; left: 10%; }
.t2 { top: 40%; left: 60%; }
.t3 { top: 70%; left: 20%; }
.t4 { top: 55%; left: 35%; }
.t5 { top: 25%; left: 70%; }

/* HEADER */
.header {
  padding: 30px 20px;
  background: linear-gradient(to bottom, #1db954, #121212);
  position: relative;
  z-index: 2;
}

.header h1 {
  margin: 0;
  font-size: 32px;
}

.contador {
  margin-top: 10px;
  color: #ddd;
  font-size: 14px;
}

/* LISTA */
.container {
  padding: 20px;
  position: relative;
  z-index: 2;
}

.card {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.card:hover {
  background: rgba(255,255,255,0.1);
}

.card img {
  width: 65px;
  height: 65px;
  border-radius: 8px;
  object-fit: cover;
}

.info h3 {
  margin: 0;
  font-size: 16px;
}

.info p {
  margin: 3px 0;
  color: #b3b3b3;
}
</style>

</head>
<body>

<!-- FRASES DE FUNDO -->
<div class="bg-text t1">te encontrei sem procurar</div>
<div class="bg-text t2">tudo ficou mais leve depois de você</div>
<div class="bg-text t3">cada música lembra um momento</div>
<div class="bg-text t4">é simples, mas é real</div>
<div class="bg-text t5">eu escolheria você de novo</div>

<div class="header">
  <h1>Nossa Playlist</h1>
  <div class="contador" id="contador"></div>
</div>

<div class="container">

  <div class="card" onclick="abrir('https://open.spotify.com/track/1ngbz6irbfEmpsYcZhzX6L')">
    <img src="baby.jpg">
    <div class="info">
      <h3>Eternamente</h3>
      <p>Gal Costa</p>
    </div>
  </div>

  <div class="card" onclick="abrir('https://open.spotify.com/track/1wr0uRurcTSeBXIfyrTVKC')">
    <img src="mulher.jpg">
    <div class="info">
      <h3>Mulher Homem Bicho</h3>
      <p>Ana Frango Elétrico</p>
    </div>
  </div>

  <div class="card" onclick="abrir('https://open.spotify.com/track/6fPan2saHdFaIHuTSatORv')">
    <img src="lunch.jpg">
    <div class="info">
      <h3>L'AMOUR DE MA VIE</h3>
      <p>Billie Eilish</p>
    </div>
  </div>

</div>

<script>
// abrir spotify
function abrir(link) {
  window.open(link, "_blank");
}

// contador
const inicio = new Date("2026-02-07T00:00:00");

function atualizar() {
  const agora = new Date();
  const diff = agora - inicio;

  const dias = Math.floor(diff / (1000*60*60*24));
  const horas = Math.floor((diff/(1000*60*60)) % 24);
  const minutos = Math.floor((diff/(1000*60)) % 60);
  const segundos = Math.floor((diff/1000) % 60);

  document.getElementById("contador").innerText =
    dias + " dias " + horas + "h " + minutos + "m " + segundos + "s";
}

setInterval(atualizar, 1000);
atualizar();
</script>

</body>
</html>
