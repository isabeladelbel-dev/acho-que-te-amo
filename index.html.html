<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Nossa Playlist</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #000;
  color: white;
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 230px;
  background: #000;
  padding: 20px;
}

.sidebar h2 {
  font-size: 16px;
  color: #b3b3b3;
}

/* MAIN */
.main {
  flex: 1;
  background: #121212;
  overflow-y: auto;
}

/* HEADER */
.header {
  display: flex;
  gap: 25px;
  padding: 30px;
  align-items: flex-end;
  background: linear-gradient(180deg, rgba(29,185,84,0.8), #121212);
  position: relative;
}

.header img {
  width: 200px;
  height: 200px;
  object-fit: cover;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

.header h1 {
  font-size: 48px;
  margin: 10px 0;
}

/* CONTADOR */
.contador {
  font-size: 14px;
  color: #ddd;
}

/* PLAY BUTTON */
.play-btn {
  margin-top: 15px;
  background: #1db954;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  cursor: pointer;
  transition: 0.2s;
}
.play-btn:hover {
  transform: scale(1.1);
}

/* LISTA */
.lista {
  padding: 20px 30px;
}

.item {
  display: grid;
  grid-template-columns: 40px 60px 1fr;
  align-items: center;
  padding: 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.2s;
}

.item:hover {
  background: #1a1a1a;
}

.item img {
  width: 45px;
  height: 45px;
}

.titulo {
  font-size: 15px;
}

.artista {
  font-size: 13px;
  color: #b3b3b3;
}

/* FUNDO DINÂMICO */
.bg-dynamic {
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: blur(80px);
  opacity: 0.25;
  z-index: -1;
  transition: 0.5s;
}

/* POEMAS */
.poema {
  position: absolute;
  color: rgba(255,255,255,0.05);
  font-size: 13px;
}
.p1 { top: 400px; left: 10%; }
.p2 { top: 800px; left: 70%; }
.p3 { top: 1200px; left: 20%; }

</style>
</head>

<body>

<div class="bg-dynamic" id="bg"></div>

<div class="sidebar">
  <h2>Sua Biblioteca</h2>
</div>

<div class="main">

  <!-- HEADER -->
  <div class="header">
    <img src="baby.jpg" id="capaTop">
    <div>
      <div style="font-size:12px;color:#b3b3b3;">Playlist</div>
      <h1>Nossa Playlist</h1>
      <div class="contador" id="contador"></div>

      <div class="play-btn" onclick="abrir('1ngbz6irbfEmpsYcZhzX6L')">▶</div>
    </div>
  </div>

  <!-- LISTA -->
  <div class="lista">

    <div class="item" 
      onmouseover="mudarFundo('baby.jpg')" 
      onclick="abrir('1ngbz6irbfEmpsYcZhzX6L')">
      <div>1</div>
      <img src="baby.jpg">
      <div>
        <div class="titulo">Eternamente</div>
        <div class="artista">Gal Costa</div>
      </div>
    </div>

    <div class="item" 
      onmouseover="mudarFundo('mulher.jpg')" 
      onclick="abrir('1wr0uRurcTSeBXIfyrTVKC')">
      <div>2</div>
      <img src="mulher.jpg">
      <div>
        <div class="titulo">Mulher Homem Bicho</div>
        <div class="artista">Ana Frango Elétrico</div>
      </div>
    </div>

    <div class="item" 
      onmouseover="mudarFundo('lunch.jpg')" 
      onclick="abrir('6fPan2saHdFaIHuTSatORv')">
      <div>3</div>
      <img src="lunch.jpg">
      <div>
        <div class="titulo">L'AMOUR DE MA VIE</div>
        <div class="artista">Billie Eilish</div>
      </div>
    </div>

  </div>

</div>

<!-- POEMAS -->
<div class="poema p1">te encontrei sem procurar</div>
<div class="poema p2">tudo ficou mais leve depois de você</div>
<div class="poema p3">eu escolheria você de novo</div>

<script>
// FUNDO DINÂMICO
function mudarFundo(img) {
  document.getElementById("bg").style.backgroundImage = "url('" + img + "')";
}

// ABRIR SPOTIFY
function abrir(id) {
  window.location.href = "spotify:track:" + id;

  setTimeout(() => {
    window.open("https://open.spotify.com/track/" + id, "_blank");
  }, 1000);
}

// CONTADOR
const inicio = new Date("2026-02-07T00:00:00");

function atualizar() {
  const agora = new Date();
  const diff = agora - inicio;

  const dias = Math.floor(diff / (1000*60*60*24));
  const horas = Math.floor((diff/(1000*60*60)) % 24);
  const minutos = Math.floor((diff/(1000*60)) % 60);

  document.getElementById("contador").innerText =
    dias + " dias, " + horas + "h " + minutos + "m juntos";
}

setInterval(atualizar, 1000);
atualizar();
</script>

</body>
</html>
