<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Nossa Playlist</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(to bottom, #1db954, #121212);
  color: white;
  overflow-x: hidden;
}

/* FRASES DE FUNDO */
.bg-text {
  position: fixed;
  color: rgba(255,255,255,0.05);
  font-size: 14px;
  pointer-events: none;
}

.t1 { top: 20%; left: 10%; }
.t2 { top: 50%; left: 70%; }
.t3 { top: 75%; left: 25%; }

/* HEADER */
.header {
  padding: 40px 20px 20px;
}

.header h1 {
  margin: 0;
  font-size: 36px;
  font-weight: 700;
}

.contador {
  margin-top: 10px;
  font-size: 14px;
  color: #e0e0e0;
}

/* LISTA */
.container {
  padding: 20px;
}

/* CARD */
.card {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 14px;
  margin: 12px 0;
  border-radius: 12px;
  cursor: pointer;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.02);
  background: rgba(255,255,255,0.08);
}

/* CAPA */
.card img {
  width: 70px;
  height: 70px;
  border-radius: 10px;
  object-fit: cover;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

/* TEXTO */
.info h3 {
  margin: 0;
  font-size: 17px;
}

.info p {
  margin: 4px 0;
  color: #cfcfcf;
  font-size: 14px;
}

/* FRASE FINAL */
.footer {
  text-align: center;
  margin-top: 40px;
  font-size: 13px;
  color: #aaa;
}
</style>

</head>
<body>

<!-- FRASES -->
<div class="bg-text t1">te encontrei sem procurar</div>
<div class="bg-text t2">tudo ficou mais leve depois de você</div>
<div class="bg-text t3">eu escolheria você de novo</div>

<div class="header">
  <h1>Nossa Playlist</h1>
  <div class="contador" id="contador"></div>
</div>

<div class="container">

  <div class="card" onclick="abrir('https://open.spotify.com/track/1ngbz6irbfEmpsYcZhzX6L')">
    <img src="baby.jpg">
    <div class="info">
      <h3>Eternamente</h3>
      <p>Gal Costa</p>
    </div>
  </div>

  <div class="card" onclick="abrir('https://open.spotify.com/track/1wr0uRurcTSeBXIfyrTVKC')">
    <img src="mulher.jpg">
    <div class="info">
      <h3>Mulher Homem Bicho</h3>
      <p>Ana Frango Elétrico</p>
    </div>
  </div>

  <div class="card" onclick="abrir('https://open.spotify.com/track/6fPan2saHdFaIHuTSatORv')">
    <img src="lunch.jpg">
    <div class="info">
      <h3>L'AMOUR DE MA VIE</h3>
      <p>Billie Eilish</p>
    </div>
  </div>

</div>

<div class="footer">
  cada música aqui tem um pedaço da nossa história
</div>

<script>
// abrir spotify
function abrir(link) {
  window.open(link, "_blank");
}

// contador
const inicio = new Date("2026-02-07T00:00:00");

function atualizar() {
  const agora = new Date();
  const diff = agora - inicio;

  const dias = Math.floor(diff / (1000*60*60*24));
  const horas = Math.floor((diff/(1000*60*60)) % 24);
  const minutos = Math.floor((diff/(1000*60)) % 60);
  const segundos = Math.floor((diff/1000) % 60);

  document.getElementById("contador").innerText =
    dias + " dias " +
    horas + "h " +
    minutos + "m " +
    segundos + "s juntos";
}

setInterval(atualizar, 1000);
atualizar();
</script>

</body>
</html>
