<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Para Você</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #0d0d0d;
  color: white;
}

/* HERO */
.hero {
  height: 300px;
  background: linear-gradient(180deg, rgba(0,0,0,0.2), #0d0d0d),
              url('baby.jpg') center/cover;
  display: flex;
  align-items: flex-end;
  padding: 30px;
}

.hero h1 {
  font-size: 42px;
  margin: 0;
}

.hero p {
  margin: 5px 0 0;
  color: #ccc;
}

/* CONTADOR */
.contador {
  padding: 15px 30px;
  font-size: 14px;
  color: #1db954;
}

/* LISTA */
.lista {
  padding: 10px 20px 40px;
}

/* ITEM */
.item {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: 0.3s;
  background: rgba(255,255,255,0.03);
}

.item:hover {
  background: rgba(255,255,255,0.08);
  transform: translateX(5px);
}

/* IMG */
.item img {
  width: 65px;
  height: 65px;
  border-radius: 10px;
  object-fit: cover;
}

/* TEXT */
.texto h3 {
  margin: 0;
  font-size: 17px;
}

.texto p {
  margin: 3px 0;
  color: #aaa;
  font-size: 14px;
}

/* FRASE */
.frase {
  text-align: center;
  padding: 20px;
  color: #888;
  font-size: 13px;
}

/* OVERLAY */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: 0.3s;
}

.overlay.active {
  opacity: 1;
  pointer-events: all;
}

.loader {
  text-align: center;
}

.loader div {
  margin-top: 10px;
}

/* bolinha */
.circle {
  width: 25px;
  height: 25px;
  border: 3px solid #555;
  border-top: 3px solid #1db954;
  border-radius: 50%;
  animation: girar 1s linear infinite;
  margin: auto;
}

@keyframes girar {
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="hero">
  <div>
    <h1>Nossa História</h1>
    <p>cada música tem um pedaço da gente</p>
  </div>
</div>

<div class="contador" id="contador"></div>

<div class="lista">

  <div class="item" onclick="abrir('1ngbz6irbfEmpsYcZhzX6L')">
    <img src="baby.jpg">
    <div class="texto">
      <h3>Eternamente</h3>
      <p>Gal Costa</p>
    </div>
  </div>

  <div class="item" onclick="abrir('1wr0uRurcTSeBXIfyrTVKC')">
    <img src="mulher.jpg">
    <div class="texto">
      <h3>Mulher Homem Bicho</h3>
      <p>Ana Frango Elétrico</p>
    </div>
  </div>

  <div class="item" onclick="abrir('6fPan2saHdFaIHuTSatORv')">
    <img src="lunch.jpg">
    <div class="texto">
      <h3>L'AMOUR DE MA VIE</h3>
      <p>Billie Eilish</p>
    </div>
  </div>

</div>

<div class="frase">
  eu escolheria você em todas as versões da vida
</div>

<div class="overlay" id="overlay">
  <div class="loader">
    <div class="circle"></div>
    <div>abrindo no spotify...</div>
  </div>
</div>

<script>
// abrir spotify com fallback
function abrir(id) {

  document.getElementById("overlay").classList.add("active");

  window.location.href = "spotify:track:" + id;

  setTimeout(() => {
    window.open("https://open.spotify.com/track/" + id, "_blank");
    document.getElementById("overlay").classList.remove("active");
  }, 1200);
}

// contador
const inicio = new Date("2026-02-07");

function atualizar() {
  const agora = new Date();
  const diff = agora - inicio;

  const dias = Math.floor(diff / (1000*60*60*24));
  const horas = Math.floor((diff/(1000*60*60)) % 24);
  const minutos = Math.floor((diff/(1000*60)) % 60);

  document.getElementById("contador").innerText =
    dias + " dias, " + horas + "h " + minutos + "m juntos";
}

setInterval(atualizar, 1000);
atualizar();
</script>

</body>
</html>
